name: Paper PDF

# Builds notes/Classical_Quadratic_Residues_Summary.pdf from the committed
# .tex with pdflatex and uploads the official PDF as a CI artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science
      - name: Build paper PDF
        run: |
          set -o pipefail
          cd notes
          pdflatex -interaction=nonstopmode Classical_Quadratic_Residues_Summary.tex
          pdflatex -interaction=nonstopmode Classical_Quadratic_Residues_Summary.tex
          test -s Classical_Quadratic_Residues_Summary.pdf
      - name: Upload paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: notes/Classical_Quadratic_Residues_Summary.pdf
          if-no-files-found: error
